    <text x="96" y="350" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="42" font-weight="740" letter-spacing="-1">shared by every coding agent.</text>
  </g>

  <g transform="translate(96 416)">
