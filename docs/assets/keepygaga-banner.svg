    <text x="73" y="33" text-anchor="middle" fill="#126b86" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="650">Local-first</text>
    <rect x="158" width="190" height="50" rx="25" fill="#ffe27d" opacity="0.42"/>
    <text x="253" y="33" text-anchor="middle" fill="#6c2b1c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="650">Markdown-native</text>
    <rect x="360" width="158" height="50" rx="25" fill="#f58a32" opacity="0.17"/>
