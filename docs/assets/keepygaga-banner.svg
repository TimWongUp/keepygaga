<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Keepygaga</title>
  <desc id="desc">A small, deliberate core memory shared by every coding agent.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#fff2d8"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" rx="48" fill="url(#background)"/>
  <circle cx="1128" cy="88" r="180" fill="#ffe27d" opacity="0.18"/>
  <circle cx="1180" cy="590" r="240" fill="#50cbed" opacity="0.08"/>
  <path d="M0 516C176 472 310 551 482 520s294-8 418 30 250 17 380-29v119H0Z" fill="#fff" opacity="0.55"/>

  <g transform="rotate(-2 102 81)">
    <rect x="68" y="56" width="76" height="58" rx="16" fill="#5a2a1f" opacity="0.13"/>
    <rect x="64" y="52" width="76" height="58" rx="16" fill="#232820" stroke="#5a2a1f" stroke-width="1"/>
    <image href="tim-wong-mark.png" x="72" y="57" width="60" height="48" preserveAspectRatio="xMidYMid meet"/>
  </g>

