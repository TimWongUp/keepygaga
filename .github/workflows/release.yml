name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync
      - name: Verify tag matches package version
        run: uv run python -c "import os, keepygaga; assert os.environ['GITHUB_REF_NAME'] == f'v{keepygaga.__version__}'"
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv build
      - run: uv run python scripts/check_distribution.py dist/*
      - name: Create or resume GitHub Release
        run: |
          asset_exists() {
            gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' \
              | grep -Fqx "$1"
          }

          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --generate-notes --verify-tag
          fi

          bundle_name="keepygaga-${GITHUB_REF_NAME#v}-distributions.zip"
          if ! asset_exists "$bundle_name"; then
            (
              cd dist
              uv run python -m zipfile -c "../$bundle_name" keepygaga-*
            )
            gh release upload "$GITHUB_REF_NAME" "$bundle_name"
          fi

          verify_dir="$(mktemp -d)"
          trap 'rm -rf "$verify_dir"' EXIT
          gh release download "$GITHUB_REF_NAME" --pattern "$bundle_name" --dir "$verify_dir"
          mkdir "$verify_dir/canonical"
          uv run python -m zipfile -e "$verify_dir/$bundle_name" "$verify_dir/canonical"
          uv run python scripts/check_distribution.py "$verify_dir/canonical"/keepygaga-*

          mkdir "$verify_dir/existing"
          for asset in "$verify_dir/canonical"/keepygaga-*; do
            asset_name="${asset##*/}"
            if asset_exists "$asset_name"; then
              gh release download "$GITHUB_REF_NAME" --pattern "$asset_name" \
                --dir "$verify_dir/existing"
              cmp "$asset" "$verify_dir/existing/$asset_name"
            else
              gh release upload "$GITHUB_REF_NAME" "$asset"
            fi
          done

          mkdir "$verify_dir/checksums"
          cp "$verify_dir/$bundle_name" "$verify_dir/canonical"/keepygaga-* \
            "$verify_dir/checksums/"
          (
            cd "$verify_dir/checksums"
            sha256sum keepygaga-* > SHA256SUMS
          )

          if asset_exists SHA256SUMS; then
            mkdir "$verify_dir/existing-checksum"
            gh release download "$GITHUB_REF_NAME" --pattern SHA256SUMS \
              --dir "$verify_dir/existing-checksum"
            cmp "$verify_dir/checksums/SHA256SUMS" \
              "$verify_dir/existing-checksum/SHA256SUMS"
          else
            gh release upload "$GITHUB_REF_NAME" "$verify_dir/checksums/SHA256SUMS"
          fi

          release_is_draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')" \
            || exit 1
          if [ "$release_is_draft" = "true" ]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
