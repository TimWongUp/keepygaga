name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-policy:
    runs-on: ubuntu-latest
    outputs:
      publish-pypi: ${{ steps.policy.outputs.publish-pypi }}
    steps:
      - name: Evaluate release policy
        id: policy
        env:
          PYPI_PUBLISH_ENABLED: ${{ vars.PYPI_PUBLISH_ENABLED }}
        run: |
          if [ "$PYPI_PUBLISH_ENABLED" = "true" ]; then
            echo "publish-pypi=enabled" >> "$GITHUB_OUTPUT"
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync
      - name: Verify tag matches package version
        run: uv run python -c "import os, keepygaga; assert os.environ['GITHUB_REF_NAME'] == f'v{keepygaga.__version__}'"
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv build
      - run: uv run python scripts/check_distribution.py dist/*
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: distributions-${{ github.run_attempt }}
          path: dist/*

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: distributions-${{ github.run_attempt }}
          path: dist
      - name: Create or resume GitHub Release
        run: |
          asset_exists() {
            gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' \
              | grep -Fqx "$1"
          }

          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --generate-notes --verify-tag
          fi

          for asset in dist/keepygaga-*; do
            if ! asset_exists "${asset##*/}"; then
              gh release upload "$GITHUB_REF_NAME" "$asset"
            fi
          done

          verify_dir="$(mktemp -d)"
          trap 'rm -rf "$verify_dir"' EXIT
          gh release download "$GITHUB_REF_NAME" --pattern 'keepygaga-*' --dir "$verify_dir"
          (
            cd "$verify_dir"
            sha256sum keepygaga-* > SHA256SUMS
          )

          if asset_exists SHA256SUMS; then
            mkdir "$verify_dir/existing"
            gh release download "$GITHUB_REF_NAME" --pattern SHA256SUMS \
              --dir "$verify_dir/existing"
            cmp "$verify_dir/SHA256SUMS" "$verify_dir/existing/SHA256SUMS"
          else
            gh release upload "$GITHUB_REF_NAME" "$verify_dir/SHA256SUMS"
          fi

          release_is_draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')" \
            || exit 1
          if [ "$release_is_draft" = "true" ]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  pypi:
    if: ${{ needs.release-policy.outputs.publish-pypi == 'enabled' }}
    needs: [build, release-policy]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: distributions-${{ github.run_attempt }}
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
