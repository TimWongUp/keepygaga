name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Sync dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run pyright

      - name: Test
        run: uv run pytest -q

      - name: Smoke test MCP server
        run: uv run python scripts/smoke_mcp_server.py

      - name: Build wheel
        run: uv build

      - name: Verify wheel install
        shell: bash
        run: |
          wheel_venv="${RUNNER_TEMP}/keepygaga-wheel"
          python -m venv "${wheel_venv}"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            wheel_python="${wheel_venv}/Scripts/python.exe"
            wheel_bin="${wheel_venv}/Scripts"
            cli_command="${wheel_bin}/keepygaga.exe"
            mcp_command="${wheel_bin}/keepygaga-mcp.exe"
          else
            wheel_python="${wheel_venv}/bin/python"
            wheel_bin="${wheel_venv}/bin"
            cli_command="${wheel_bin}/keepygaga"
            mcp_command="${wheel_bin}/keepygaga-mcp"
          fi
          "${wheel_python}" -m pip install dist/*.whl
          "${cli_command}" --help
          "${wheel_python}" -P scripts/smoke_mcp_server.py --server-command "${mcp_command}"
