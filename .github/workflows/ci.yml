name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Sync dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run pyright

      - name: Test
        run: uv run pytest -q

      - name: Smoke test MCP server
        run: uv run python scripts/smoke_mcp_server.py

      - name: Build wheel
        run: uv build

      - name: Verify wheel install
        shell: bash
        run: |
          pip install dist/*.whl
          keepygaga --help
          keepygaga-mcp --help 2>&1 | head -1 || true
