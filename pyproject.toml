[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "keepygaga"
version = "0.1.0"
description = "A warm, local-first keeper of memories for AI agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "filelock>=3.16,<4",
  "mcp>=1.0.0",
  "pydantic>=2.7,<3",
  "python-frontmatter>=1.1,<2",
]

[dependency-groups]
dev = [
  "pyright>=1.1.400,<2",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[project.scripts]
keepygaga = "keepygaga.cli:main"

[tool.setuptools.packages.find]
include = ["keepygaga*"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
ignore = ["E501"]

[tool.pyright]
include = ["keepygaga", "mcp_server.py", "scripts", "tests"]
exclude = ["**/__pycache__", ".keepygaga", ".venv"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
pythonpath = ["."]
