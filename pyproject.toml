[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "keepygaga"
dynamic = ["version"]
description = "A warm, local-first keeper of memories for AI agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "TimWongUp" }]
requires-python = ">=3.12"
keywords = ["ai-agents", "local-first", "markdown", "mcp", "memory"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "filelock>=3.16,<4",
  "mcp>=1.12,<1.29",
  "pydantic>=2.7,<3",
  "python-frontmatter>=1.1,<2",
  "ruamel.yaml>=0.18,<0.19",
]

[dependency-groups]
dev = [
  "pyright>=1.1.400,<2",
  "pytest>=9.0.3,<10",
  "ruff>=0.11,<1",
]

[project.scripts]
keepygaga = "keepygaga.cli:main"
keepygaga-mcp = "keepygaga.server:main"

[project.urls]
Homepage = "https://github.com/TimWongUp/keepygaga"
Documentation = "https://github.com/TimWongUp/keepygaga/tree/main/docs"
Issues = "https://github.com/TimWongUp/keepygaga/issues"
Repository = "https://github.com/TimWongUp/keepygaga"

[tool.setuptools.packages.find]
include = ["keepygaga", "keepygaga.*"]

[tool.setuptools.package-data]
keepygaga = ["mcp_instructions.md"]

[tool.setuptools.dynamic]
version = { attr = "keepygaga.version.APPLICATION_VERSION" }

[tool.setuptools.data-files]
"share/keepygaga" = [
  "docs/agent-contract.md",
  "docs/legacy-agent-contract-v0.md",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "C90", "E", "F", "I", "SIM", "UP"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pyright]
include = ["keepygaga", "scripts", "tests"]
exclude = ["**/__pycache__", ".keepygaga", ".venv"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
pythonpath = ["."]
